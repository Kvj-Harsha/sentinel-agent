name: sentinel-agent

services:
  prometheus:
    image: sentinel-prometheus:v3.5.0-local
    build: ops/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - prometheus-data:/prometheus
    depends_on:
      alertmanager:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/wget", "-q", "-O", "/dev/null", "-T", "2", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5

  alertmanager:
    image: sentinel-alertmanager:v0.28.1
    build: ops/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - alertmanager-secrets:/run/secrets:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "/bin/wget", "-q", "-O", "/dev/null", "-T", "2", "http://127.0.0.1:9093/-/ready"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

volumes:
  prometheus-data:
  alertmanager-secrets:
    name: sentinel-agent_alertmanager-secrets
    external: true
