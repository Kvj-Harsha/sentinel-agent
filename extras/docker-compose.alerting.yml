name: sentinel-agent

services:
  prometheus:
    image: sentinel-prometheus:v3.5.0-local
    build: ops/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - prometheus-data:/prometheus
    depends_on:
      - alertmanager

  alertmanager:
    image: sentinel-alertmanager:v0.28.1
    build: ops/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - alertmanager-secrets:/run/secrets:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  prometheus-data:
  alertmanager-secrets:
    name: sentinel-agent_alertmanager-secrets
    external: true
